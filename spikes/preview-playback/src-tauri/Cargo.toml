[package]
name = "kuaide-preview-playback"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[features]
# Embed ../ui in every build, so plain `cargo build` needs no dev server or npm.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
